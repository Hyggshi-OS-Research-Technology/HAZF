name: CI

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libzstd-dev libgtk-4-dev libadwaita-1-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DHAZF_BUILD_GUI=ON

      - name: Build
        run: |
          set -o pipefail
          cmake --build build -j$(nproc) 2>&1 | tee /tmp/build.log
          echo "--- BUILD LOG TAIL ---"
          tail -n 200 /tmp/build.log

      - name: Dump build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Build failed — capturing log"
          cat /tmp/build.log 2>/dev/null | tail -n 600 || echo "no log"
          # prepare comment body via commit comment (api.github.com allowed)
          LOG="$(cat /tmp/build.log 2>/dev/null | tail -c 45000)"
          if [ -z "$LOG" ]; then LOG="empty log"; fi
          SHA=$(git rev-parse HEAD)
          echo "Posting comment on $SHA"
          # Use gh api to post commit comment — truncate to 60000 chars max (API limit)
          BODY=$(printf '```\n%s\n```' "$LOG" | head -c 60000)
          PAYLOAD=$(jq -n --arg body "$BODY" '{body: $body}')
          echo "$PAYLOAD" | gh api "repos/Hyggshi-OS-Research-Technology/HAZF/commits/$SHA/comments" -X POST --input - > /tmp/comment.json || echo "comment failed"
          cat /tmp/comment.json || true
          echo "Done"


      - name: Run smoke tests
        run: bash tests/smoke.sh

      - name: Test GUI build
        run: |
          ls -lh build/hazf-gui || echo "hazf-gui not built"
          ./build/hazf-gui --help || echo "GUI help check"

      - name: Test install
        run: |
          sudo cmake --install build
          hazf --help
          hazf-gui --help || true

  package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libzstd-dev debhelper

      - name: Build package
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
          cd build && cpack -G DEB || echo "cpack deb skipped"
          ls -lh build/*.deb || true
