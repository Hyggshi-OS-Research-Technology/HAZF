<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c211"/>
      <stop offset="100%" stop-color="#e5a50a"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f6f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.20"/>
    </filter>
    <filter id="innerShadow">
      <feOffset dx="0" dy="1"/>
      <feGaussianBlur stdDeviation="1" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000" flood-opacity="0.08" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="45%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="white" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect x="8" y="8" width="112" height="112" rx="24" ry="24" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Stacked papers effect - back layers -->
  <g opacity="0.95">
    <rect x="28" y="18" width="72" height="84" rx="10" ry="10" fill="white" opacity="0.18" transform="rotate(3 64 60)"/>
    <rect x="26" y="20" width="72" height="84" rx="10" ry="10" fill="white" opacity="0.28" transform="rotate(-2 64 60)"/>
  </g>

  <!-- Main archive folder body -->
  <path d="M 28 34 L 28 92 Q 28 98 34 98 L 94 98 Q 100 98 100 92 L 100 38 Q 100 32 94 32 L 54 32 L 46 24 Q 42 20 36 20 L 34 20 Q 28 20 28 26 Z" fill="url(#folderGrad)" stroke="#d48c00" stroke-width="0.7" filter="url(#shadow)"/>

  <!-- Inner paper -->
  <rect x="34" y="38" width="60" height="52" rx="6" ry="6" fill="url(#paperGrad)" stroke="#e6e6e6" stroke-width="0.6"/>

  <!-- Paper lines (representing files) -->
  <rect x="40" y="48" width="36" height="3.5" rx="1.7" fill="#3584e4" opacity="0.9"/>
  <rect x="40" y="55" width="28" height="3" rx="1.5" fill="#9a9996" opacity="0.55"/>
  <rect x="40" y="61.5" width="32" height="3" rx="1.5" fill="#9a9996" opacity="0.55"/>
  <rect x="40" y="68" width="24" height="3" rx="1.5" fill="#9a9996" opacity="0.45"/>

  <!-- Zstd badge / compression icon -->
  <g transform="translate(74,66)">
    <circle cx="0" cy="0" r="16" fill="white" stroke="#3584e4" stroke-width="1.4" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="13.5" fill="none" stroke="#3584e4" stroke-width="0.6" opacity="0.25"/>
    <!-- arrows compress -->
    <path d="M -6 3 L -6 -6 L -2 -2 M -6 -6 L -10 -2" stroke="#1c71d8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 6 -3 L 6 6 L 2 2 M 6 6 L 10 2" stroke="#1c71d8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="-3.5" y="-1.5" width="7" height="3" rx="1" fill="#3584e4"/>
  </g>

  <!-- HAZF text on folder tab -->
  <text x="64" y="30.5" text-anchor="middle" font-family="Cantarell, Ubuntu, sans-serif" font-weight="800" font-size="10" fill="white" letter-spacing="0.6" opacity="0.98" style="text-shadow: 0 1px 2px rgba(0,0,0,0.25);">HAZF</text>

  <!-- Bottom integrity check badge -->
  <g transform="translate(64,102)">
    <rect x="-26" y="-9" width="52" height="16" rx="8" ry="8" fill="white" opacity="0.96" filter="url(#shadow)"/>
    <circle cx="-14" cy="0" r="5.5" fill="#26a269"/>
    <path d="M -17 0 L -14.2 2.8 L -10.5 -2.2" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="4" y="3.5" text-anchor="middle" font-family="Cantarell" font-weight="700" font-size="6.5" fill="#2e3436" letter-spacing="0.3">CRC32 • ZSTD</text>
  </g>

  <!-- Shine overlay -->
  <rect x="8" y="8" width="112" height="112" rx="24" ry="24" fill="url(#shine)" opacity="0.9"/>

  <!-- Subtle highlight top -->
  <path d="M 32 16 Q 64 10 96 16" stroke="white" stroke-width="1.2" opacity="0.18" stroke-linecap="round" fill="none"/>
</svg>
